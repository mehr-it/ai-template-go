# Copied into docker_inner/postgres.yml during bootstrap when the owner picks postgres.
# Placeholders below (`__project_prefix__`) are sed-rewritten by bootstrap.

services:
  postgres:
    image: postgres:17-alpine
    # Inner containers use plain runc; sysbox-runc is the outer workspace runtime.
    runtime: runc
    environment:
      POSTGRES_USER: __project_prefix__
      POSTGRES_PASSWORD: __project_prefix__
      POSTGRES_DB: __project_prefix___test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __project_prefix__ -d __project_prefix___test"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
