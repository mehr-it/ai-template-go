services:
  postgres:
    image: postgres:17-alpine
    # Inner containers use plain runc; sysbox-runc is the outer workspace runtime.
    runtime: runc
    environment:
      POSTGRES_USER: wasi
      POSTGRES_PASSWORD: wasi
      POSTGRES_DB: wasi_test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasi -d wasi_test"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
