services:
  signal-cli:
    # Upstream image lives on ghcr.io, NOT Docker Hub (there is no `asamk/signal-cli`).
    image: ghcr.io/asamk/signal-cli:latest
    # Inner containers use plain runc; sysbox-runc is the outer workspace runtime.
    runtime: runc
    # Entrypoint is `signal-cli --config=/var/lib/signal-cli`, so this appends the subcommand.
    # Bind 0.0.0.0 (not the localhost default) or the port is unreachable from outside the container.
    command:
      - daemon
      - --http
      - 0.0.0.0:8080
      - --receive-mode
      - on-connection
      - --no-receive-stdout
    volumes:
      # Linked-device credentials live here. Survives `up`/`down` cycles, wiped by `down.sh -v`.
      - signal_cli_data:/var/lib/signal-cli
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      # The image ships no curl/wget/nc, so probe via bash's /dev/tcp against the
      # daemon's own health endpoint. CMD-SHELL is unusable here: /bin/sh is dash,
      # which has no /dev/tcp.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /api/v1/check HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"']
      interval: 5s
      timeout: 5s
      retries: 30
      # JVM cold start is ~15-20s; do not count those as failures.
      start_period: 30s

volumes:
  signal_cli_data:
